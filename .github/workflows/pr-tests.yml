name: PR regression tests (no deployment)
on:
  pull_request:
    branches: [main, proposal/engaging-21days-ux]
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated content
        run: |
          node tools/build-content.js
          git diff --exit-code -- app/js/content.js
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run regression tests
        run: npm test
