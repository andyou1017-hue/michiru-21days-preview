<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>満ちる眼｜受講生ログイン</title><link rel="stylesheet" href="/_login.css"></head>
<body><main class="view"><section class="card"><p class="eyebrow">満ちる眼</p><h1>21日間への入口</h1><p>招待を受け取った方だけが利用できます。初めての方は、招待されたメールアドレスと招待コードを入力してください。</p>
<form id="login-form"><div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" maxlength="254" required></div>
<div class="field"><label for="password">パスワード（12〜128文字）</label><input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></div>
<div class="field"><label for="invite">初めての方：招待コード</label><input id="invite" type="password" autocomplete="off" maxlength="43"><p class="muted">2回目からはメールアドレスとパスワードでログインできます。</p></div>
<button class="btn primary" id="submit" type="submit">はじめる・ログイン</button><p id="login-message" role="status" aria-live="polite"></p></form>
<p class="muted">記録はこの端末のブラウザに保存されます。機種変更には設定からバックアップを保存してください。自動同期はありません。</p></section></main><script src="/_login.js"></script></body></html>
